openapi: "3.0.3"
info:
  title: Diet App Consultation Management API
  description: Appointment booking, pre-consult forms, session summaries and admin scheduling
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local Development

security:
  - BearerAuth: []

tags:
  - name: Appointments
    description: Book, view and manage consultation appointments
  - name: PreConsult
    description: Pre-consultation health forms submitted before an appointment
  - name: SessionSummaries
    description: Post-session notes, feedback and ratings

paths:

  # ── Appointments ─────────────────────────────────────────────────────────────

  /api/v1/consultations:
    get:
      tags: [Appointments]
      summary: Get current user's appointments
      operationId: getMyAppointments
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [upcoming, completed, cancelled]
      responses:
        '200':
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentResponse'
    post:
      tags: [Appointments]
      summary: Book a new consultation appointment
      operationId: bookAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
      responses:
        '201':
          description: Booked appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'

  /api/v1/consultations/{id}:
    get:
      tags: [Appointments]
      summary: Get a single appointment by ID
      operationId: getAppointment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'

  /api/v1/consultations/{id}/cancel:
    patch:
      tags: [Appointments]
      summary: Cancel an appointment
      operationId: cancelAppointment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Cancelled appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'

  /api/v1/consultations/admin/all:
    get:
      tags: [Appointments]
      summary: Get all appointments across all clients (Admin)
      operationId: getAllAppointments
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [upcoming, completed, cancelled]
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: All appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentResponse'

  /api/v1/consultations/admin/{id}/accept:
    patch:
      tags: [Appointments]
      summary: Accept a consultation request (Admin)
      operationId: acceptAppointment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAppointmentRequest'
      responses:
        '200':
          description: Accepted appointment with meet link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'

  /api/v1/consultations/admin/{id}/complete:
    patch:
      tags: [Appointments]
      summary: Mark a consultation as completed (Admin)
      operationId: completeAppointment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Completed appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'

  # ── Pre-Consult ──────────────────────────────────────────────────────────────

  /api/v1/consultations/{id}/pre-consult:
    get:
      tags: [PreConsult]
      summary: Get pre-consult form for an appointment
      operationId: getPreConsult
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Pre-consult form data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreConsultResponse'
        '204':
          description: No pre-consult form submitted yet
    post:
      tags: [PreConsult]
      summary: Submit pre-consult form for an appointment
      operationId: submitPreConsult
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreConsultRequest'
      responses:
        '201':
          description: Pre-consult form submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreConsultResponse'

  # ── Session Summaries ────────────────────────────────────────────────────────

  /api/v1/consultations/{id}/summary:
    get:
      tags: [SessionSummaries]
      summary: Get session summary/notes for a completed appointment
      operationId: getSessionSummary
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Session summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummaryResponse'
        '204':
          description: No summary available yet
    post:
      tags: [SessionSummaries]
      summary: Add session notes and summary (Admin)
      operationId: addSessionSummary
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSummaryRequest'
      responses:
        '201':
          description: Session summary created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummaryResponse'

  /api/v1/consultations/{id}/rate:
    post:
      tags: [SessionSummaries]
      summary: Rate a completed consultation session (Client)
      operationId: rateSession
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateSessionRequest'
      responses:
        '200':
          description: Rating submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummaryResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:

    AppointmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        clientId:
          type: integer
          format: int64
        clientName:
          type: string
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
          example: "10:00 AM"
        type:
          type: string
          enum: [initial, follow_up, emergency]
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        meetLink:
          type: string
        preConsultSubmitted:
          type: boolean
        rating:
          type: integer
          minimum: 1
          maximum: 5
        createdAt:
          type: string
          format: date-time

    BookAppointmentRequest:
      type: object
      required:
        - appointmentDate
        - appointmentTime
        - type
      properties:
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
          example: "10:00 AM"
        type:
          type: string
          enum: [initial, follow_up, emergency]
        notes:
          type: string

    AcceptAppointmentRequest:
      type: object
      required:
        - meetLink
      properties:
        meetLink:
          type: string
        confirmedDate:
          type: string
          format: date
        confirmedTime:
          type: string

    PreConsultRequest:
      type: object
      properties:
        currentConcerns:
          type: string
        recentDietChanges:
          type: string
        currentMedications:
          type: string
        labReportUrls:
          type: array
          items:
            type: string
        additionalNotes:
          type: string

    PreConsultResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        appointmentId:
          type: integer
          format: int64
        currentConcerns:
          type: string
        recentDietChanges:
          type: string
        currentMedications:
          type: string
        labReportUrls:
          type: array
          items:
            type: string
        additionalNotes:
          type: string
        submittedAt:
          type: string
          format: date-time

    SessionSummaryRequest:
      type: object
      required:
        - notes
      properties:
        notes:
          type: string
        recommendations:
          type: string
        followUpRequired:
          type: boolean

    SessionSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        appointmentId:
          type: integer
          format: int64
        notes:
          type: string
        recommendations:
          type: string
        followUpRequired:
          type: boolean
        clientRating:
          type: integer
          minimum: 1
          maximum: 5
        clientFeedback:
          type: string
        createdAt:
          type: string
          format: date-time

    RateSessionRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        feedback:
          type: string
