spring:
  application:
    name: diet-app-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dietapp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret-key: ${JWT_SECRET_KEY:dietapp-secret-key-must-be-at-least-32-chars-long}
  access-token-validity: ${ACCESS_TOKEN_EXPIRY:86400000}    # 24 hours ms
  refresh-token-validity: ${REFRESH_TOKEN_EXPIRY:604800000} # 7 days ms

security:
  public-access:
    - /api/v1/auth/**
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs/**
  cors:
    mappings:
      - path: /**
        allowed-origins:
          - http://localhost:5173
          - http://localhost:3000
        allowed-methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        allow-credentials: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    doc-expansion: none
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.dietapp: DEBUG
    org.springframework.security: WARN
